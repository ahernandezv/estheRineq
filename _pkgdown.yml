url: https://ahernandezv.github.io/estheRineq/
template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles / Guías
      menu:
      - text: Getting Started (English)
        href: articles/getting-started.html
      - text: Guía en Español
        href: articles/guia-en-espanol.html

reference:
- title: Survey & Disaggregated Data Containers
  desc: Define complex multistage survey designs, disaggregated surveillance tables, and weighted fractional ranks.
  contents:
  - survey_health_data
  - grouped_health_data
  - compute_fractional_ranks
  - xtile

- title: Concentration, Classical, WHO 21 & SII/RII Measures
  desc: Estimate rank-dependent concentration indices, curves, classical indices, all 21 WHO HEAT measures, and SII/RII.
  contents:
  - concentration_index
  - concentration_curve
  - survey_mean
  - classical_inequality
  - decompose_subgroup_ge
  - who_summary
  - sii_rii

- title: Standardization & Horizontal Inequity
  desc: Compute age/sex standardized rates (DSR, SMR, ISR), need-standardized outcomes, and Horizontal Inequity (HI).
  contents:
  - direct_standardize
  - indirect_standardize
  - get_standard_population
  - standardize_health_need
  - horizontal_inequity

- title: Regression & Counterfactual Decompositions
  desc: Decompose health inequalities via reference-invariant Wagstaff, RIF-I-OLS, and counterfactual RIF-Oaxaca models.
  contents:
  - decompose_wagstaff
  - decompose_rif
  - decompose_oaxaca_rif

- title: Editorial Visualizations
  desc: Generate publication-ready Pelotas equiplots, concentration curves, ridit gradients, forest plots, and funnel plots.
  contents:
  - equiplot
  - classify_inequality_pattern
  - plot_curve
  - plot_sii_gradient
  - plot_decomposition
  - funnel_plot
  - get_palette

- title: STROBE-Equity Reporting & Exporters
  desc: Export trilingual (English, Spanish, Portuguese) tables and automated STROBE-Equity notes to Markdown, LaTeX, HTML, Excel, and Word.
  contents:
  - strobe_equity_note
  - to_markdown
  - to_latex
  - to_html
  - to_excel
  - to_word
  - esther-s3-methods

- title: Influence Functions, Variance Kernels & Sample Data
  desc: Low-level Gateaux influence functions, variance estimators, and built-in epidemiological datasets.
  contents:
  - influence_concentration_index
  - compute_rif
  - influence_generalized_entropy
  - influence_atkinson
  - influence_curve_ordinates
  - ultimate_cluster_variance
  - convenient_regression_variance
  - replicate_weights_variance
  - rao_wu_survey_bootstrap
  - survey_mch
  - who_disaggregated
  - district_mortality
  - load_survey_mch
  - load_who_disaggregated
  - load_district_mortality
